{% extends "base.html" %}

{% block title %}Admin Login — ANTROTHON'27{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/admin.css?v=7">
{% endblock %}

{% block content %}
<div class="admin-login-wrapper">
  <div class="admin-login-box">
    <div class="hud-corner hud-corner-tl"></div>
    <div class="hud-corner hud-corner-tr"></div>
    <div class="hud-corner hud-corner-bl"></div>
    <div class="hud-corner hud-corner-br"></div>

    <div style="text-align:center; margin-bottom:28px;">
      <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin:0 auto 16px; flex-wrap:wrap;">
        <img src="/static/img/patrician_logo.png" alt="Patrician College Logo" style="width:50px; height:50px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(255,208,0,0.35)); flex-shrink:0;" title="Patrician College of Arts and Science">
        <div style="width:76px; height:76px; flex-shrink:0;">
          <img src="/static/img/logo.png?v=5" alt="ANTROTHON'27 Logo" style="width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 0 16px rgba(255,208,0,0.5));">
        </div>
        <div style="background:#ffffff; padding:4px 8px; border-radius:4px; display:inline-flex; align-items:center; box-shadow:0 0 10px rgba(255,255,255,0.25); flex-shrink:0;" title="Institution's Innovation Council (Ministry of Education Initiative)">
          <img src="/static/img/iic_logo.png" alt="Institution's Innovation Council" style="height:28px; width:auto; display:block;">
        </div>
      </div>
      <span class="mono-tag" style="color:var(--term-red); font-size:12px;">PATRICIAN INSTITUTE INNOVATION CELL (PIIC)</span>
      <h2 style="font-size:22px; color:#fff; margin-top:4px;">ADMIN COMMAND PORTAL</h2>
    </div>

    {% if error %}
    <div style="background:rgba(255,208,0,0.15); border:1px solid var(--term-red); color:var(--term-red); padding:10px 14px; border-radius:4px; font-family:var(--font-tactical); font-size:13px; margin-bottom:20px; text-align:center; width:100%; box-sizing:border-box;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="username">USERNAME</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">PASSWORD</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-terminator" style="width:100%; padding:14px;">
        <span>AUTHENTICATE &amp; ENTER COMMAND CENTER</span>
      </button>
    </form>

  </div>
</div>
{% endblock %}
